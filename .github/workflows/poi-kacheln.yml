# Baut monatlich die POI-Kacheln (Europa) aus den Geofabrik-Extrakten und lädt sie per FTP nach scooter.thai-klasse.de/poi/.
# Land für Land: herunterladen, filtern, löschen – so reicht die Platte des Runners.
# Zugangsdaten nur als Repository-Secrets (Settings → Secrets and variables → Actions):
#   POI_FTP_HOST, POI_FTP_USER, POI_FTP_PASS und POI_FTP_DIR (Zielordner, z. B. /scooter.thai-klasse.de/poi)
name: POI-Kacheln

on:
  schedule:
    - cron: '17 2 3 * *' # am 3. jedes Monats, nachts
  workflow_dispatch:
    inputs:
      regions:
        description: 'Nur diese Geofabrik-Regionen (z. B. "europe/germany/bayern"), leer = ganz Europa'
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: sudo apt-get update -q && sudo apt-get install -yq osmium-tool lftp jq

      - name: Regionen
        env:
          REGIONS: ${{ github.event.inputs.regions }}
        run: |
          if [ -n "$REGIONS" ]; then
            for r in $REGIONS; do echo "https://download.geofabrik.de/$r-latest.osm.pbf"; done > urls.txt
          else
            curl -fsSL https://download.geofabrik.de/index-v1-nogeom.json \
              | jq -r '.features[].properties | select(.parent == "europe") | .urls.pbf' > urls.txt
          fi
          wc -l urls.txt

      - name: Filtern
        run: |
          expr=$(python3 tools/poi-kacheln.py --osmium)
          : > pois.geojsonseq
          while read -r url; do
            echo "::group::$url"
            curl -fsSL --retry 3 -o land.osm.pbf "$url"
            osmium tags-filter -O -o land-pois.osm.pbf land.osm.pbf $expr
            osmium export -O -f geojsonseq -a type,id -o land.geojsonseq land-pois.osm.pbf
            cat land.geojsonseq >> pois.geojsonseq
            rm -f land.osm.pbf land-pois.osm.pbf land.geojsonseq
            echo "::endgroup::"
          done < urls.txt

      - name: Kacheln
        run: python3 tools/poi-kacheln.py out < pois.geojsonseq && du -sh out

      - name: Hochladen
        env:
          FTP_HOST: ${{ secrets.POI_FTP_HOST }}
          FTP_USER: ${{ secrets.POI_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.POI_FTP_PASS }}
          FTP_DIR: ${{ secrets.POI_FTP_DIR }}
        run: |
          [ -n "$FTP_HOST" ] || { echo "Keine FTP-Secrets gesetzt – Upload übersprungen"; exit 0; }
          # Erst die Kacheln, zuletzt index.json: die App sieht den neuen Stand erst, wenn alles oben ist
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "set ftp:ssl-force true; set net:max-retries 3;
            mkdir -pf $FTP_DIR/t; mirror -R --delete --parallel=4 out/t $FTP_DIR/t; put out/index.json -o $FTP_DIR/index.json; bye"
