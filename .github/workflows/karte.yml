# Schneidet die Vektorkarte (PMTiles) für das Gebiet in tools/karte-gebiet.geojson aus dem aktuellen Protomaps-Build
# und lädt sie per FTPS als poi/karte.pmtiles hoch (gleiches FTP-Konto und gleiche Secrets wie die POI-Kacheln).
# Größe bei Zoom 14: ca. 20 GB (gemessen 10/2026). Läuft im März, Juli und Oktober, auf Wunsch auch von Hand.
name: Karte

on:
  schedule:
    - cron: '41 1 1 3,7,10 *'
  workflow_dispatch:
    inputs:
      maxzoom:
        description: 'Höchste Zoomstufe (14 ≈ 20 GB, 15 ≈ 40 GB)'
        default: '14'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -q && sudo apt-get install -yq lftp
          url=$(gh api repos/protomaps/go-pmtiles/releases/latest --jq '.assets[] | select(.name | test("Linux_x86_64")) | .browser_download_url')
          curl -fsSL "$url" | tar xz pmtiles

      - name: Platz
        run: |
          # Vorinstallierte SDKs weg, dann den größeren Datenträger nehmen
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/karte && sudo chown "$USER" /mnt/karte
          free() { df --output=avail -B1G "$1" | tail -1; }
          if [ "$(free /mnt)" -ge "$(free "$HOME")" ]; then echo "WORK=/mnt/karte" >> "$GITHUB_ENV"; else echo "WORK=$HOME" >> "$GITHUB_ENV"; fi
          df -h / /mnt

      - name: Ausschneiden
        env:
          Z: ${{ github.event.inputs.maxzoom || '14' }}
        run: |
          build=$(curl -fsSL https://build-metadata.protomaps.dev/builds.json | jq -r '.[-1].key')
          ./pmtiles extract "https://build.protomaps.com/$build" "$WORK/karte.pmtiles" --region=tools/karte-gebiet.geojson --maxzoom="$Z" --download-threads=4
          echo "::notice::Build $build, Zoom bis $Z, $(du -h "$WORK/karte.pmtiles" | cut -f1)"

      - name: Hochladen
        env:
          FTP_HOST: ${{ secrets.POI_FTP_HOST }}
          FTP_USER: ${{ secrets.POI_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.POI_FTP_PASS }}
          FTP_DIR: ${{ secrets.POI_FTP_DIR }}
        run: |
          [ -n "$FTP_HOST" ] || { echo "::warning::Keine FTP-Secrets gesetzt – Upload übersprungen"; exit 0; }
          dir="${FTP_DIR%/}"
          # Alte Karte zuerst löschen (sonst bräuchte der Server kurz den doppelten Platz), neue unter .part hochladen
          # und erst fertig umbenennen: die App sieht nie eine halbe Datei. In der Zwischenzeit zeigt sie die Online-Karte.
          # Das Zertifikat des Hosters lautet auf *.hosttech.eu, daher FTPS ohne Namensprüfung, nie unverschlüsselt.
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "set ftp:ssl-force true; set ssl:verify-certificate no;
            set net:max-retries 8; set net:timeout 60; set net:reconnect-interval-base 15;
            rm -f $dir/karte.pmtiles.part; rm -f $dir/karte.pmtiles; put -c $WORK/karte.pmtiles -o $dir/karte.pmtiles.part;
            mv $dir/karte.pmtiles.part $dir/karte.pmtiles; bye" > lftp.log 2>&1 \
            || { echo "::error::Upload fehlgeschlagen: $(tail -3 lftp.log | tr '\n' ' ')"; exit 1; }
          echo "::notice::Karte hochgeladen"
