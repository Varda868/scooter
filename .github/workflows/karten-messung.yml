# Einmalige Messung: wie groß wäre ein PMTiles-Ausschnitt aus dem Protomaps-Build (nur --dry-run, lädt nichts herunter)
name: Karten-Messung
on:
  push:
    branches: [karten-messung]
permissions:
  contents: read
jobs:
  messen:
    runs-on: ubuntu-latest
    steps:
      - name: pmtiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/protomaps/go-pmtiles/releases/latest --jq '.assets[] | select(.name | test("Linux_x86_64")) | .browser_download_url')
          curl -fsSL "$url" | tar xz pmtiles
          build=$(curl -fsSL https://build-metadata.protomaps.dev/builds.json | jq -r '.[-1].key')
          echo "::notice::Build $build"
          echo '{"type": "Polygon", "coordinates": [[[-11, 34], [30.2, 34], [30.2, 45.3], [28.3, 45.3], [26.7, 48.3], [24.2, 48.3], [24.2, 53.9], [25.8, 54.2], [26.9, 55.7], [28.3, 56.1], [28.3, 57.5], [28.0, 59.5], [27.7, 60.5], [29.6, 61.5], [31.7, 62.9], [30.2, 67.0], [28.9, 69.0], [31.2, 70.0], [31.2, 71.5], [-11, 71.5], [-11, 34]]]}' > europa.json
          for z in 14 15; do
            out=$(./pmtiles extract "https://build.protomaps.com/$build" x.pmtiles --region=europa.json --maxzoom=$z --dry-run 2>&1 | grep -i "archive size" | tail -1)
            echo "::notice::Europa-Polygon z$z: $out"
          done
